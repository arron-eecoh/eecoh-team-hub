<style>
/* Layout: operations console. Sticky top bar + view tabs, one working view at a time, edit drawer on the right. */
:root {
  --bg: #EEF1EE; --surface: #FFFFFF; --surface2: #F6F8F6; --ink: #16211C; --muted: #5E6B64; --line: #D9E0DB;

  --p-luciana: #B06A0C; --p-luciana-s: #F7E8D2; --p-arron: #2E5E9C; --p-arron-s: #DDE7F4; --p-none: #6F7873; --p-none-s: #E5E8E6;
  --ok: #2F7D4F; --ok-s: #DDEFE3; --warn: #A86A00; --warn-s: #F8EBCF; --bad: #B0392A; --bad-s: #F7DEDA;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --shadow: 0 1px 2px rgba(22,33,28,.06), 0 4px 14px rgba(22,33,28,.06);
  --scrim: rgba(10,16,13,.35);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1512; --surface: #17201B; --surface2: #131B17; --ink: #E7EEEA; --muted: #9AA8A0; --line: #27332D;
  --accent: #5CC2A6; --accent-soft: #1C3830; --on-accent: #0B1410;
  --p-flo: #4CC7AC; --p-flo-s: #173A32; --p-lucia: #C895DA; --p-lucia-s: #33233A; --p-luciana: #E8A84E; --p-luciana-s: #3A2C17;
  --p-arron: #88AEE6; --p-arron-s: #1E2C40; --p-none: #9AA39E; --p-none-s: #262E2A;
  --ok: #6CCB92; --ok-s: #1B3526; --warn: #E6B352; --warn-s: #3A2E17; --bad: #F08A7A; --bad-s: #40221D;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); --scrim: rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1512; --surface: #17201B; --surface2: #131B17; --ink: #E7EEEA; --muted: #9AA8A0; --line: #27332D;
  --accent: #5CC2A6; --accent-soft: #1C3830; --on-accent: #0B1410;
  --p-flo: #4CC7AC; --p-flo-s: #173A32; --p-lucia: #C895DA; --p-lucia-s: #33233A; --p-luciana: #E8A84E; --p-luciana-s: #3A2C17;
  --p-arron: #88AEE6; --p-arron-s: #1E2C40; --p-none: #9AA39E; --p-none-s: #262E2A;
  --ok: #6CCB92; --ok-s: #1B3526; --warn: #E6B352; --warn-s: #3A2E17; --bad: #F08A7A; --bad-s: #40221D;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); --scrim: rgba(0,0,0,.5); color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.45 var(--body); -webkit-font-smoothing: antialiased; }

h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 12.5px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 0; }
.bar1 { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; flex: 1; min-width: 0; }
.brand h1 { font-size: 20px; }
.sync { font: 500 11.5px/1 var(--mono); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.live i { background: var(--ok); } .sync.warn i { background: var(--warn); } .sync.bad i { background: var(--bad); }
.viewer { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.viewer select, .sel { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 10px 11px 11px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; display: inline-flex; gap: 7px; align-items: center; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.badge { font: 500 11px/1 var(--mono); padding: 3px 6px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--line); }
.badge.hot { background: var(--bad-s); color: var(--bad); border-color: transparent; }

main { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 80px; }
.vhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.vhead h2 { font-size: 26px; }
.vhead p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.pad { padding: 14px 16px; }
.sec { font: 600 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 11px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.ghost { background: none; border-color: transparent; color: var(--accent); padding-inline: 6px; }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 99px; background: var(--p-none-s); white-space: nowrap; }
.pill .d { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.o-Florencia { background: var(--p-flo-s); color: var(--p-flo); } .o-Lucia { background: var(--p-lucia-s); color: var(--p-lucia); }
.o-Luciana { background: var(--p-luciana-s); color: var(--p-luciana); } .o-Arron { background: var(--p-arron-s); color: var(--p-arron); }
.o-Toassign { background: var(--p-none-s); color: var(--p-none); }
.st-late { background: var(--bad-s); color: var(--bad); } .st-today { background: var(--warn-s); color: var(--warn); }
.st-wait { background: var(--warn-s); color: var(--warn); } .st-prog { background: var(--accent-soft); color: var(--accent); }
.st-done { background: var(--ok-s); color: var(--ok); } .st-block { background: var(--bad-s); color: var(--bad); }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); }
.notice { padding: 12px 16px; border-left: 4px solid var(--warn); }

/* task rows */
.trow { display: grid; grid-template-columns: 4px auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 14px 9px 0; border-top: 1px solid var(--line); }
.trow:first-child { border-top: 0; }
.trow:hover { background: var(--surface2); }
.stripe { align-self: stretch; min-height: 30px; border-radius: 0 3px 3px 0; }
.pr-High { background: var(--bad); } .pr-Medium { background: var(--warn); } .pr-Low { background: var(--p-none); }
.tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface2); display: grid; place-items: center; padding: 0; color: transparent; }
.tick:hover { border-color: var(--ok); color: var(--ok); }
.tick.on { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
.tlink { background: none; border: 0; padding: 0; text-align: left; font-weight: 500; }
.tlink:hover { color: var(--accent); text-decoration: underline; }
.trow .m { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.trow .when { font: 12px var(--mono); color: var(--muted); text-align: right; white-space: nowrap; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.kpi { padding: 12px 14px; }
.kpi b { display: block; font: 600 24px/1.1 var(--display); }
.kpi span { font-size: 12.5px; color: var(--muted); }
.meter { height: 10px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--line); overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; border-radius: 99px; }

/* filters */
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 11px; font-size: 12.5px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 0; width: 200px; }

/* gantt */
.gwrap { overflow-x: auto; position: relative; }
.gantt { --cw: 46px; --lw: 260px; position: relative; }
@media (max-width: 600px) { .gantt { --lw: 160px; } }
.ghead, .grow { display: grid; grid-template-columns: var(--lw) auto; }
.ghead { position: sticky; top: 0; background: var(--surface); z-index: 3; border-bottom: 1px solid var(--line); }
.gdays { display: flex; }
.gday { width: var(--cw); flex: none; font: 11px/1.2 var(--mono); color: var(--muted); text-align: center; padding: 8px 0 7px; border-left: 1px solid var(--line); }
.gday.today { color: var(--accent); font-weight: 500; background: var(--accent-soft); }
.gday.wk { border-left: 2px solid var(--muted); }
.glabel { position: sticky; left: 0; background: var(--surface); z-index: 2; padding: 6px 10px; font-size: 13px; border-right: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.glabel button { background: none; border: 0; padding: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.glabel button:hover { color: var(--accent); }
.grp .glabel { font: 600 12px/1 var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 12px; background: var(--surface2); }
.grp .gtrack { background: var(--surface2); }
.gtrack { position: relative; height: 32px; background-image: repeating-linear-gradient(90deg, transparent 0 calc(var(--cw) - 1px), var(--line) calc(var(--cw) - 1px) var(--cw)); }
.gbar { position: absolute; top: 5px; height: 22px; border-radius: 5px; border: 0; padding: 0 12px 0 7px; font: 500 11px/22px var(--body); color: var(--on-accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; cursor: grab; touch-action: none; user-select: none; }
.gbar.dragging { cursor: grabbing; box-shadow: 0 6px 16px rgba(0,0,0,.25); z-index: 4; }
.gbar .rz { position: absolute; right: 0; top: 0; bottom: 0; width: 9px; cursor: ew-resize; background: rgba(255,255,255,.25); }
.gbar.done { opacity: .35; }
.gbar.late { box-shadow: 0 0 0 2px var(--bad); }
.b-Florencia { background: var(--p-flo); } .b-Lucia { background: var(--p-lucia); } .b-Luciana { background: var(--p-luciana); } .b-Arron { background: var(--p-arron); } .b-Toassign { background: var(--p-none); }
.gline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 1; pointer-events: none; }
.gms { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--bad); z-index: 1; pointer-events: none; }
.gms span { position: absolute; top: 2px; left: 4px; font: 500 10.5px var(--mono); color: var(--bad); background: var(--surface); padding: 1px 4px; border-radius: 3px; white-space: nowrap; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }

/* load */
.lwrap { overflow-x: auto; }
table.load { border-collapse: separate; border-spacing: 4px; width: 100%; min-width: 680px; }
table.load th { font: 500 11px var(--mono); color: var(--muted); text-align: center; padding: 4px; }
table.load th.p { text-align: left; font: 600 13px var(--body); color: var(--ink); white-space: nowrap; }
table.load td { text-align: center; border-radius: 7px; padding: 0; font: 500 12.5px var(--mono); }
table.load td button { width: 100%; border: 0; background: none; padding: 9px 4px; font: inherit; color: inherit; }
.c0 { background: var(--surface2); color: var(--muted); } .c1 { background: var(--ok-s); color: var(--ok); }
.c2 { background: var(--warn-s); color: var(--warn); } .c3 { background: var(--bad-s); color: var(--bad); font-weight: 600; }
.cap { font: 11px var(--mono); color: var(--muted); font-weight: 400; display: flex; gap: 4px; align-items: center; }
.cap input { width: 52px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface2); font: 11px var(--mono); }

/* board */
.board { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-width: 0; min-height: 120px; }
.col.over { border-color: var(--accent); background: var(--accent-soft); }
.col h3 { font: 600 13px var(--body); display: flex; justify-content: space-between; margin: 2px 2px 10px; }
.card { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; margin-bottom: 8px; box-shadow: var(--shadow); cursor: grab; }
.card:hover { border-color: var(--accent); }
.card.drag { opacity: .4; }
.card .t { font-weight: 500; font-size: 13.5px; }
.card .m { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }

/* list table */
.twrap { overflow-x: auto; }
table.tt { border-collapse: collapse; width: 100%; min-width: 980px; font-size: 13px; }
table.tt th { text-align: left; font: 600 11.5px var(--body); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 9px 6px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); white-space: nowrap; }
table.tt th button { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
table.tt td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.tt tr.done td { opacity: .55; }
table.tt tr.sel td { background: var(--accent-soft); }
table.tt select, table.tt input[type=date], table.tt input[type=number] { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 5px; font-size: 12.5px; max-width: 100%; }
table.tt select:hover, table.tt input:hover, table.tt select:focus, table.tt input:focus { border-color: var(--line); background: var(--surface2); }
table.tt input[type=number] { width: 58px; font-family: var(--mono); }
table.tt input[type=date] { font-family: var(--mono); width: 128px; }
.bulk { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); margin-top: 12px; z-index: 5; padding: 10px 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-color: var(--accent); }

/* flags */
.flag { padding: 13px 16px; display: grid; gap: 8px; }
.flag + .flag { border-top: 1px solid var(--line); }
.flag .hd { display: flex; gap: 10px; align-items: flex-start; }
.ftype { font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .05em; padding: 5px 7px; border-radius: 5px; flex: none; }
.ft-blocker, .ft-overdue, .ft-blocked { background: var(--bad-s); color: var(--bad); }
.ft-capacity { background: var(--warn-s); color: var(--warn); }
.ft-question, .ft-unassigned { background: var(--p-arron-s); color: var(--p-arron); }
.ft-fyi { background: var(--p-none-s); color: var(--p-none); }
.fixes { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-left: 2px; }
.fixes .sel { padding: 3px 6px; font-size: 12px; }
.sub { display: grid; gap: 6px; padding: 8px 10px; background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; }
.sub .r { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; }
.resolve { display: flex; gap: 6px; flex-wrap: wrap; }
.resolve input { flex: 1; min-width: 160px; background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 13px; }
.flag.resolved { opacity: .6; }

/* forms */
form.add, .fgrid { display: grid; gap: 10px; }
label.f { display: grid; gap: 4px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
label.f input, label.f textarea, label.f select { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--ink); width: 100%; font-size: 14px; }
label.f textarea { min-height: 70px; resize: vertical; }
.f2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.f3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .f3 { grid-template-columns: minmax(0, 1fr); } }

/* ideas */
.icard { padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; }
.icard + .icard { border-top: 1px solid var(--line); }
.icard h3 { font-size: 16px; }
.icard p { margin: 4px 0 8px; color: var(--muted); }
.vote { display: grid; justify-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; background: var(--surface2); min-width: 54px; align-self: start; }
.vote[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.vote b { font: 600 16px var(--mono); }

/* log */
.log { display: grid; }
.lrow { display: grid; grid-template-columns: 130px 90px minmax(0, 1fr); gap: 10px; padding: 8px 16px; border-top: 1px solid var(--line); font-size: 13px; }
.lrow:first-child { border-top: 0; }
@media (max-width: 600px) { .lrow { grid-template-columns: minmax(0, 1fr); gap: 2px; } }

/* drawer */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--surface); z-index: 21; border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(0,0,0,.15); overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 18px; }

const useCap = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(() => null) : Promise.resolve(null);

/* ===================== state ===================== */
const S = { tasks: {}, ideas: {}, flags: {}, people: {}, dates: {}, comments: {}, notify: {}, meta: {}, time: {}, log: [], backup: null,
  loaded: { tasks: false }, db: null, user: null, uid: null, isOwner: false, canAdmin: false, readOnly: false,

function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify({ me: S.me, autoBackup: S.autoBackup, collapsed: S.collapsed, sched: S.sched, dayW: S.dayW, f: S.f, gby: S.gby, colorBy: S.colorBy, crit: S.crit })); } catch (e) {} }

/* ===================== helpers ===================== */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cls = s => String(s || "").replace(/[^A-Za-z0-9]/g, "");
const pd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const fmt = (s, wd) => { if (!s) return ""; const d = pd(s); return (wd ? WD[d.getDay()] + " " : "") + MON[d.getMonth()] + " " + d.getDate(); };
const isWork = s => { const g = pd(s).getDay(); return g !== 0 && g !== 6; };
function addWork(s, n) { const d = pd(s); let k = 0; const step = n < 0 ? -1 : 1; if (n === 0) { while (!isWork(iso(d))) d.setDate(d.getDate() + 1); return iso(d); } while (k !== n) { d.setDate(d.getDate() + step); if (isWork(iso(d))) k += step; } return iso(d); }
function workdays(a, b) { const out = []; if (!a || !b) return out; const d = pd(a), e = pd(b); while (d <= e) { const s = iso(d); if (isWork(s)) out.push(s); d.setDate(d.getDate() + 1); } return out; }
function span(t) { return Math.max(1, workdays(t.start, t.end).length); }
const REAL_TODAY = iso(new Date());

const pad2 = n => String(n).padStart(2, "0");
const nowStamp = () => { const d = new Date(); return iso(d) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()); };
const fmtH = h => (Math.round((+h || 0) * 10) / 10).toFixed(1);
const clone = o => JSON.parse(JSON.stringify(o));
const tasks = () => Object.values(S.tasks);
const task = id => S.tasks[id];
const isDone = t => t.status === "Done";
const clients = () => (S.meta.clients && S.meta.clients.list && S.meta.clients.list.length) ? S.meta.clients.list : DEFAULT_CLIENTS;
const clientName = id => { const c = clients().find(x => x.id === id); return c ? c.name : (id || ""); };
const initials = n => (n || "?").slice(0, 1).toUpperCase();
const nextFriday = from => { const d = pd(from); const add = (5 - d.getDay() + 7) % 7; d.setDate(d.getDate() + add); return iso(d); };
function state(t) {
  if (isDone(t)) return "done";
  if (!t.end) return "open";
  if (t.end < TODAY) return "late";

}
function blocker(t) { const d = t.dep && task(t.dep); return d && !isDone(d) ? d : null; }
const kids = id => tasks().filter(x => x.parent === id);
const sortT = l => l.slice().sort((a, b) => (a.end || "9").localeCompare(b.end || "9") || PRIOS.indexOf(a.prio) - PRIOS.indexOf(b.prio) || (a.order || 0) - (b.order || 0));
const byOrder = l => l.slice().sort((a, b) => (a.order || 0) - (b.order || 0));
const ownerPill = o => '<span class="pill o-' + cls(o) + '"><span class="d"></span>' + esc(o) + "</span>";
function statusPills(t) {

  if (t.status === "Working on it") out += '<span class="pill st-prog">In progress</span>';
  if (t.status === "Waiting on Arron") out += '<span class="pill st-wait">Waiting on Arron</span>';
  const st = state(t);
  if (st === "late") out += '<span class="pill st-late">Overdue</span>';
  if (st === "today") out += '<span class="pill st-today">Due today</span>';
  if (blocker(t) && t.start && t.start <= TODAY) out += '<span class="pill st-block">Blocked</span>';
  if (S.requests && pendingFor(t.id).length) out += '<span class="pill st-wait">Pending approval</span>';
  return out;
}
const cap = p => { const v = S.people[p] && S.people[p].cap; return v === "" || v == null ? null : +v; };
const emailOf = p => (S.people[p] && S.people[p].email) || "";
function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
function opts(list, cur) { return list.map(v => '<option value="' + esc(v) + '"' + (v === cur ? " selected" : "") + ">" + esc(v) + "</option>").join(""); }
function clientOpts(cur, withAll) { return (withAll ? '<option value="All"' + (cur === "All" ? " selected" : "") + ">All clients</option>" : '<option value="">No client</option>') + clients().map(c => '<option value="' + esc(c.id) + '"' + (c.id === cur ? " selected" : "") + ">" + esc(c.name) + "</option>").join(""); }
const groupName = g => (g || "Other").replace(/^\d+\.\s*/, "");

function parseMentions(text) {
  const out = new Set(); (text.match(/@([A-Za-z]+)/g) || []).forEach(m => { const p = MENTION[m.slice(1).toLowerCase()]; if (p) out.add(p); });
  return [...out];
}
const linkify = text => esc(text).replace(/@([A-Za-z]+)/g, (m, n) => MENTION[n.toLowerCase()] ? '<span class="mention">@' + esc(MENTION[n.toLowerCase()]) + "</span>" : m);

/* filters shared by schedule, board and list */
function passF(t) {
  const F = S.f, q = F.q.trim().toLowerCase();
  if (F.owner !== "All" && t.owner !== F.owner) return false;
  if (F.client !== "All" && (t.client || "") !== F.client) return false;

  return true;
}
function filterBar(opts2) {
  opts2 = opts2 || {};
  const groups = [...new Set(tasks().map(t => t.group || "Other"))].sort();
  return '<div class="fbar"><input class="search" id="fq" type="search" placeholder="Search" value="' + esc(S.f.q) + '" aria-label="Search tasks">' +
    '<select class="sel" id="fOwner" aria-label="Owner">' + ['<option value="All">Everyone</option>'].concat(OWNERS.map(o => '<option' + (o === S.f.owner ? " selected" : "") + ">" + o + "</option>")).join("") + "</select>" +
    '<select class="sel" id="fClient" aria-label="Client">' + clientOpts(S.f.client, true) + "</select>" +
    '<select class="sel" id="fGroup" aria-label="Group"><option value="All">All groups</option>' + groups.map(g => '<option value="' + esc(g) + '"' + (g === S.f.group ? " selected" : "") + ">" + esc(groupName(g)) + "</option>").join("") + "</select>" +
    (opts2.hideDone ? '<label class="tg"><input type="checkbox" id="fHide"' + (S.f.hideDone ? " checked" : "") + "> Hide done</label>" : "") +
    ((S.f.owner !== "All" || S.f.client !== "All" || S.f.group !== "All" || S.f.q) ? '<button class="btn sm ghost" type="button" data-fclear>Clear filters</button>' : "") +
    (opts2.extra || "") + "</div>";
}

/* calendar range for schedule + load */
function dayRange(list) {
  const open = (list || tasks()).filter(t => t.start);
  let a = open.reduce((m, t) => t.start < m ? t.start : m, addWork(TODAY, -3));
  if (a < addWork(TODAY, -15)) a = addWork(TODAY, -15);
  let b = open.reduce((m, t) => t.end > m ? t.end : m, addWork(TODAY, 10));
  let days = workdays(addWork(a, 0), b);
  if (days.length > 70) days = days.slice(0, 70);
  return days;
}
function loadMap(days) {
  const m = {}; OWNERS.forEach(o => { m[o] = {}; days.forEach(d => m[o][d] = 0); });
  tasks().forEach(t => {
    if (isDone(t) || !t.start || !m[t.owner] || kids(t.id).length) return;
    let ds = workdays(t.start, t.end).filter(d => d >= TODAY);
    if (!ds.length) ds = [TODAY];
    ds.forEach(d => { if (m[t.owner][d] != null) m[t.owner][d] += (+t.hrs || 0) / ds.length; });
  });
  return m;
}
function tasksOn(person, day) { return tasks().filter(t => t.owner === person && !isDone(t) && t.start && (workdays(t.start, t.end).includes(day) || (t.end < TODAY && day === TODAY))); }
function nextOpenDay(person, hrs, from) {
  const c = cap(person); let d = addWork(from, 0);
  const days = workdays(d, addWork(d, 30)); const m = loadMap(days);
  if (!c) return d;
  for (const x of days) if (m[person][x] + (+hrs || 0) <= c * 1.05) return x;
  return d;
}

/* ===================== data layer ===================== */
const queues = {};
function put(path, data) {
  const run = () => data === null ? S.db.doc(path).delete() : S.db.doc(path).set(data);
  queues[path] = (queues[path] || Promise.resolve()).then(run, run);
  return queues[path];
}
function setSync(kind, text) { const el = document.getElementById("sync"); el.className = "sync " + kind; el.lastChild.textContent = text; }
const MAPS = { tasks: "tasks", ideas: "ideas", flags: "flags", people: "people", dates: "dates", comments: "comments", notify: "notify", meta: "meta", requests: "requests", milestones: "milestones", colors: "colors", feedback: "feedback" };
function applyLocal(path, data) {
  const parts = path.split("/");
  if (parts[0] === "time" && parts.length === 4) { if (data === null) delete S.time[parts[3]]; else S.time[parts[3]] = Object.assign({ id: parts[3], _path: path }, data); return; }
  const key = MAPS[parts[0]]; if (!key || parts.length !== 2) return;
  if (data === null) delete S[key][parts[1]]; else S[key][parts[1]] = Object.assign({ id: parts[1] }, data);
}
function stamp(o) { const x = Object.assign({}, o); delete x.id; delete x._path; x.updatedAt = nowStamp(); x.updatedBy = S.me; return x; }
function before(map, id) { const b = map[id] ? clone(map[id]) : null; if (b) { delete b.id; delete b._path; } return b; }

/* every save goes through here: writes, logs, notifies people, offers undo */
async function commit(changes, label, o) {
  o = o || {};
  if (!changes.length) return false;
  if (!o.skipGate) {
    const g = classify(changes);
    if (g.patches.length && g.lvl > 0) {
      const prioBlocked = g.patches.some(pt => pt.fields && "prio" in pt.fields) && !canSetPrio();
      if (prioBlocked) { toast("Only Arron and Lucia can change priorities."); render(); return false; }
      if (g.direct.length) await commit(g.direct, label, Object.assign({}, o, { skipGate: true, noUndo: true, toast: false }));
      return createRequest(label, g.patches, g.lines, g.lvl);
    }
  }
  if (!S.db) { toast("Changes can't be saved right now. Check your connection."); return false; }
  if (S.readOnly) { toast("You have view-only access, so changes aren't saved."); return false; }
  const notes = (o.notify || []).slice();
  if (!o.noNotify) changes.forEach(c => {
    if (c.path.startsWith("tasks/") && c.after && c.after.owner && OWNERS.includes(c.after.owner) && c.after.owner !== "To assign" && c.after.owner !== S.me && (!c.before || c.before.owner !== c.after.owner) && !isDoneObj(c.after))
      notes.push({ to: c.after.owner, type: "assign", taskId: c.path.split("/")[1], text: S.me + " gave you \"" + c.after.item + "\"" + (c.after.end ? ", due " + fmt(c.after.end, true) : "") });
  });
  const oosBefore = new Set(oosList().map(x => x.t.id)), riskBefore = new Set(msRisk().map(x => x.m.id));
  changes.forEach(c => applyLocal(c.path, c.after));
  const oosNew = changes.some(c => c.path.startsWith("tasks/")) ? oosList().filter(x => !oosBefore.has(x.t.id)) : [];
  const riskNew = changes.some(c => c.path.startsWith("tasks/") || c.path.startsWith("milestones/")) ? msRisk().filter(x => !riskBefore.has(x.m.id)) : [];
  if (riskNew.length) {
    riskNew.forEach(x => { const txt = msShort(x.m) + " is now at risk: " + msLine(x.m, x.i) + " (after " + S.me + "'s change)"; [...new Set([x.m.owner || "Lucia"].concat(msOf(x.m.parent) ? [] : ["Arron"]))].filter(p => p !== S.me).forEach(p => notes.push({ to: p, type: "flag", taskId: x.i.driver ? x.i.driver.id : "", text: txt })); });
    o = Object.assign({}, o, { extra: (o.extra || "") + '<button type="button" data-view="flags">◆ ' + riskNew.length + " milestone" + (riskNew.length > 1 ? "s" : "") + " at risk</button>" });
  }
  if (oosNew.length) {
    oosNew.forEach(x => { if (x.t.owner !== S.me && OWNERS.includes(x.t.owner) && x.t.owner !== "To assign") notes.push({ to: x.t.owner, type: "flag", taskId: x.t.id, text: "\"" + x.t.item + "\" is now out of sequence: it starts " + fmt(x.t.start, true) + " but \"" + x.p.item + "\" isn't due until " + fmt(x.p.end, true) + " (after " + S.me + "'s change)." }); });
    o = Object.assign({}, o, { extra: (o.extra || "") + '<button type="button" data-view="flags">⚠ ' + oosNew.length + " out of sequence</button>" });
  }
  render();
  try {
    setSync("warn", "Saving");
    for (const c of changes) await put(c.path, c.after);
    if (!o.noLog) {
      const first = changes[0], item = (first.after || first.before || {});
      await S.db.collection("log").add({ at: new Date().toISOString(), by: S.me, action: label, itemId: first.path.split("/")[1], item: item.item || item.title || item.msg || "", details: o.details || (changes.length > 1 ? changes.length + " items" : "") });
    }
    setSync("live", "Saved");
    if (notes.length) await queueNotify(notes);
    if (!o.noUndo) { S.undo = changes.map(c => ({ path: c.path, before: c.before, after: c.after })); toast(label, true, o.extra); }
    else if (o.toast !== false) toast(label, false, o.extra);
    scheduleBackup();
    return true;
  } catch (e) {
    changes.forEach(c => applyLocal(c.path, c.before));
    render();
    setSync("bad", "Not saved");
    if (e && e.code === "invalid_argument") { toast("You don't have edit access to this part of the hub."); }
    else if (e && e.code === "quota_exceeded") toast("The hub's storage is full. Ask Arron to archive old log entries.");
    else toast("Couldn't save. Check your connection and try again.");
    return false;
  }
}
const isDoneObj = t => t.status === "Done";
function changeTask(id, patch) { const t = task(id); return { path: "tasks/" + id, before: before(S.tasks, id), after: stamp(Object.assign({}, t, patch)) }; }
function saveTask(id, patch, label, o) { return commit([changeTask(id, patch)], label, o); }
async function undo() {
  const u = S.undo; if (!u) return; S.undo = null;
  await commit(u.slice().reverse().map(c => ({ path: c.path, before: c.after, after: c.before })), "Undid last change", { noUndo: true, skipGate: true });
}

/* notifications: an inbox entry per person, emailed by the hub's sender (hourly) or right away when Arron is the one acting */
async function queueNotify(list) {
  const seen = new Set();
  for (const n of list) {
    if (!n.to || n.to === S.me || !PEOPLE_ORDER.includes(n.to)) continue;
    const k = n.to + n.type + (n.taskId || ""); if (seen.has(k)) continue; seen.add(k);
    const id = uid("n"), doc = { to: n.to, type: n.type, taskId: n.taskId || "", text: n.text, from: S.me, at: new Date().toISOString(), read: false, emailed: false };
    applyLocal("notify/" + id, doc);
    try { await put("notify/" + id, doc); } catch (e) {}
    if (S.isOwner && ["assign", "mention", "nudge", "flag", "approval", "decision"].includes(n.type)) sendNow(id, doc);
  }
  render();
}
async function sendNow(id, doc) {
  const to = emailOf(doc.to); if (!to) return;
  const mcp = await useCap("mcp"); if (!mcp) return;
  const t = doc.taskId && task(doc.taskId);
  const body = "Hi " + doc.to + ",\n\n" + doc.text + "\n" + (t ? "\nTask: " + t.item + (t.end ? "\nDue: " + fmt(t.end, true) : "") + "\n" : "") + "\nOpen the Team Hub: " + HUB_URL + "\n\nSent from the EECOH Team Hub";
  try {
    await mcp.callTool(GMAIL, "send_message", { to: [to], subject: "Team Hub: " + (doc.type === "assign" ? "new task for you" : doc.type === "nudge" ? "someone is waiting on you" : doc.type === "flag" ? "new flag" : "you were mentioned"), body });
    const d = Object.assign({}, doc, { emailed: true, emailedAt: new Date().toISOString() });
    applyLocal("notify/" + id, d); await put("notify/" + id, d);
  } catch (e) { /* the hourly sender picks it up */ }
}
async function msNudge(taskId, msId) {
  const t = task(taskId), m = msOf(msId); if (!t || !m) return;
  if (nudgeAlready(taskId)) { toast("You already nudged " + t.owner + " about this today."); return; }

function pickColor(kind, name, key) {
  const cur = Object.assign({}, colorsDoc(kind)); delete cur.id;
  /* make the current defaults explicit so nobody silently lands on a taken colour */
  if (kind === "people") PEOPLE_ORDER.forEach(n => { if (!cur[n]) cur[n] = personColor(n); });
  else clients().forEach(c => { if (!cur[c.id]) cur[c.id] = clientColor(c.id); });
  const owner = Object.keys(cur).find(n => cur[n] === key && n !== name);

  commit([{ path: "colors/" + kind, before: S.colors[kind] ? Object.assign({}, S.colors[kind]) : null, after: cur }], (kind === "people" ? (name === "Florencia" ? "Flor" : name) : name) + " is now " + PAL[key].n).then(() => { if (document.getElementById("colT")) openColors(); });

/* critical path: the chain of linked tasks that sets when each milestone (or, with no milestones, each project) finishes */
function critInfo() {
  const ends = [];
  const mm = mains().filter(m => m.status !== "done");
  if (mm.length) mm.forEach(m => { const i = msInfo(m); if (i.driver) ends.push({ label: "◆ " + m.title, due: m.date, fc: i.fc, slip: i.slip, slack: i.slack, t: i.driver }); });
  else {
    const by = {}; tasks().filter(t => !isDone(t) && t.end && t.client).forEach(t => { if (!by[t.client] || t.end > by[t.client].end) by[t.client] = t; });
    Object.entries(by).forEach(([c, t]) => ends.push({ label: c, fc: t.end, t }));
  }
  const ids = new Set();
  ends.forEach(e => { const chain = []; let c = e.t, n = 0; while (c && !isDone(c) && n++ < 80) { ids.add(c.id); chain.push(c); c = task(c.dep); } e.chain = chain.reverse(); });
  return { ids, ends };
}

/* ===================== milestones ===================== */
/* Main milestones hold sub-milestones. Each activity (task) feeds one milestone through task.ms.
   Forecast = the latest finish of everything feeding it: its open activities (overdue ones count as finishing today)
   and, for a main milestone, its sub-milestones' forecasts. Compared with the deadline to show on track / at risk. */
const MS_LABEL = { ok: "On track", risk: "At risk", late: "Missed", done: "Done", ready: "Work done", empty: "No activities yet" };
const mss = () => Object.values(S.milestones || {});
const msOf = id => id && (S.milestones || {})[id];
const byDate = l => l.slice().sort((a, b) => (a.date || "9").localeCompare(b.date || "9") || (a.title || "").localeCompare(b.title || ""));
const mains = () => byDate(mss().filter(m => !m.parent || !msOf(m.parent)));
const subsOf = id => byDate(mss().filter(m => m.parent === id));
const msTasks = id => tasks().filter(t => t.ms === id);
function msInfo(m) {
  const ts = msTasks(m.id), subs = msOf(m.parent) ? [] : subsOf(m.id);
  let fc = "", driver = null, first = "", total = ts.length, doneN = ts.filter(isDone).length;
  ts.forEach(t => {
    if (t.start && (!first || t.start < first)) first = t.start;
    if (isDone(t)) return;
    const e = t.end ? (t.end < TODAY ? TODAY : t.end) : "";
    if (e && e > fc) { fc = e; driver = t; }
  });
  subs.forEach(s => {
    const i = msInfo(s); total += i.total; doneN += i.doneN;
    if (i.first && (!first || i.first < first)) first = i.first;
    if (i.fc && i.fc > fc) { fc = i.fc; driver = i.driver; }
  });
  let status;
  if (m.status === "done") status = "done";
  else if (!total) status = "empty";
  else if (doneN === total) status = "ready";
  else if (m.date && m.date < TODAY) status = "late";
  else if (fc && m.date && fc > m.date) status = "risk";
  else status = "ok";
  const slip = fc && m.date && fc > m.date ? workdays(addWork(m.date, 1), fc).length : 0;
  const slack = fc && m.date && fc < m.date ? workdays(addWork(fc, 1), m.date).length : 0;
  return { fc, driver, first, total, doneN, status, slip, slack, subs };
}

  if (t.matches("[data-reassign]") && t.value) { const k = task(t.dataset.reassign); saveTask(k.id, { owner: t.value }, "Gave " + k.item + " to " + t.value); return; }
  if (t.matches("[data-fwd]") && t.value) { const f = S.flags[t.dataset.fwd]; commit([{ path: "flags/" + f.id, before: before(S.flags, f.id), after: stamp(Object.assign({}, f, { to: t.value })) }], "Passed flag to " + t.value, { notify: [{ to: t.value, type: "flag", taskId: f.task, text: S.me + " passed you a flag: " + f.msg }] }); return; }
  if (t.matches("[data-ischedsel]") && t.value) { ideaToTask(S.ideas[t.dataset.ischedsel], t.value); return; }
  if (t.matches("[data-cap]")) { const p = t.dataset.cap, v = t.value === "" ? "" : Math.max(0, +t.value); commit([{ path: "people/" + p, before: before(S.people, p), after: stamp(Object.assign({}, S.people[p] || {}, { cap: v })) }], p + "'s daily hours set to " + v); return; }
  if (t.matches("[data-pemail]")) { const p = t.dataset.pemail, v = t.value.trim(); commit([{ path: "people/" + p, before: before(S.people, p), after: stamp(Object.assign({}, S.people[p] || {}, { email: v })) }], p + "'s email set to " + v); return; }
  if (t.matches("[data-lf]")) {
    const k = task(t.dataset.id), f = t.dataset.lf; let v = t.value; if (f === "hrs") v = +v || 0;
    if (f === "status" && v === "Done" && !isDone(k)) { closeTask(k.id); return; }
    const patch = { [f]: v };
    if (f === "start" && v && (!k.end || k.end < v)) patch.end = v;
    if (f === "end" && v && (!k.start || k.start > v)) patch.start = v;
    const ch = [changeTask(k.id, patch)].concat(f === "end" && v > (k.end || "") ? chainChanges(k.id, patch) : []);
    commit(ch, "Edited " + k.item, { details: f + " → " + v + (ch.length > 1 ? ", pushed " + (ch.length - 1) + " that wait on it" : "") }); return;
  }
  if (t.matches("[data-lsel]")) { t.checked ? S.list.sel.add(t.dataset.lsel) : S.list.sel.delete(t.dataset.lsel); S.confirmBulkDel = false; render(); return; }
  if (t.id === "lall") { const rows = [...document.querySelectorAll("[data-lsel]")].map(c => c.dataset.lsel); t.checked ? rows.forEach(r => S.list.sel.add(r)) : S.list.sel.clear(); render(); return; }
  if (t.id === "bOwner" && t.value) { const ch = [...S.list.sel].map(id => changeTask(id, { owner: t.value })); commit(ch, "Gave " + ch.length + " tasks to " + t.value); return; }
  if (t.id === "bStatus" && t.value) { const ch = [...S.list.sel].map(id => changeTask(id, { status: t.value })); commit(ch, "Set " + ch.length + " tasks to " + t.value); return; }
  if (t.id === "bClient" && t.value) { const ch = [...S.list.sel].map(id => changeTask(id, { client: t.value })); commit(ch, "Set client on " + ch.length + " tasks"); return; }
  if (t.id === "fOwner") { S.f.owner = t.value; saveLocal(); render(); return; }
  if (t.id === "fClient") { S.f.client = t.value; saveLocal(); render(); return; }
  if (t.id === "fGroup") { S.f.group = t.value; saveLocal(); render(); return; }
  if (t.id === "fHide") { S.f.hideDone = t.checked; saveLocal(); render(); return; }
  if (t.id === "lstatus") { S.list.status = t.value; render(); return; }
  if (t.id === "ldue") { S.list.due = t.value; render(); return; }
  if (t.id === "hP") { S.hoursPerson = t.value; render(); return; }
  if (t.id === "autoB") { S.autoBackup = t.checked; saveLocal(); return; }
  if (t.id === "meSel") { S.me = t.value; saveLocal(); render(); updatePresence(); return; }
});
let qTimer;
document.addEventListener("input", e => { if (e.target.id === "fq") { clearTimeout(qTimer); const v = e.target.value; qTimer = setTimeout(() => { S.f.q = v; render(); }, 220); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.linkFrom) { S.linkFrom = null; render(); return; }
  if (e.key === "Escape") { if (document.getElementById("modalRoot").innerHTML) closeModal(); else closeDrawer(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".gdia[data-msbar]")) { e.preventDefault(); if (S.linkFrom) linkToMs(S.linkFrom, e.target.dataset.msbar); else openMs(e.target.dataset.msbar); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-bar],[data-card]")) { e.preventDefault(); openTask(e.target.dataset.bar || e.target.dataset.card); }
  if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && e.target.matches("[data-bar]")) { e.preventDefault(); shiftTask(e.target.dataset.bar, e.key === "ArrowRight" ? 1 : -1); }
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target.matches("[data-compose] textarea")) { e.preventDefault(); const f = e.target.closest("[data-compose]"); sendComment(f.dataset.compose, e.target); }
  if ((e.metaKey || e.ctrlKey) && e.key === "z" && S.undo && !e.target.matches("input,textarea")) { e.preventDefault(); undo(); }
});

/* link drag: pull the dot at the end of a bar onto the next task */
let ldrag = null;
document.addEventListener("pointerdown", e => {
  const dot = e.target.closest("[data-link]"); if (!dot || e.button > 0) return;
  const g = document.querySelector("#gscroll .gantt"); if (!g) return;
  const gr = g.getBoundingClientRect(), r = dot.getBoundingClientRect();
  ldrag = { id: dot.dataset.link, g, x0: e.clientX, y0: e.clientY, sx: r.left + r.width / 2 - gr.left, sy: r.top + r.height / 2 - gr.top, moved: false };
  e.preventDefault();
});
document.addEventListener("pointermove", e => {
  if (!ldrag) return;
  if (Math.abs(e.clientX - ldrag.x0) + Math.abs(e.clientY - ldrag.y0) > 6) ldrag.moved = true;
  if (!ldrag.moved) return;
  const ln = document.getElementById("gtemp"), gr = ldrag.g.getBoundingClientRect(); if (!ln) return;
  ln.setAttribute("x1", ldrag.sx); ln.setAttribute("y1", ldrag.sy); ln.setAttribute("x2", e.clientX - gr.left); ln.setAttribute("y2", e.clientY - gr.top); ln.setAttribute("visibility", "visible");
  document.querySelectorAll(".gbar.ltarget").forEach(b => b.classList.remove("ltarget"));
  document.querySelectorAll(".gdia.ltarget").forEach(b => b.classList.remove("ltarget"));
  const over = document.elementFromPoint(e.clientX, e.clientY), tb = over && (over.closest("#gscroll [data-bar]") || over.closest("#gscroll .gdia[data-msbar]"));
  if (tb && tb.dataset.bar !== ldrag.id) tb.classList.add("ltarget");
});
document.addEventListener("pointerup", e => {
  if (!ldrag) return;
  const d = ldrag; ldrag = null;
  if (!d.moved) return; /* a tap: the click handler starts tap-to-link */
  S.linkDragDone = true; setTimeout(() => { S.linkDragDone = false; }, 60);
  const over = document.elementFromPoint(e.clientX, e.clientY), msEl = over && (over.closest("#gscroll [data-msbar]") || over.closest("#gscroll [data-ms]"));
  if (msEl) { linkToMs(d.id, msEl.dataset.msbar || msEl.dataset.ms); return; }
  const tgt = over && (over.closest("#gscroll [data-bar]") || over.closest("#gscroll [data-task]"));
  const to = tgt && (tgt.dataset.bar || tgt.dataset.task);
  if (to && to !== d.id) finishLink(d.id, to); else { S.linkFrom = null; render(); }
});

/* gantt drag: move whole bar, or right edge to resize */
let drag = null;
document.addEventListener("pointerdown", e => {
  const bar = e.target.closest("[data-bar]"); if (!bar || e.button > 0) return;
  const t = task(bar.dataset.bar); if (!t) return;
  drag = { id: t.id, el: bar, x0: e.clientX, left0: parseFloat(bar.style.left), w0: parseFloat(bar.style.width), resize: !!e.target.closest("[data-rz]"), moved: false };
  bar.setPointerCapture(e.pointerId);
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x0; if (Math.abs(dx) > 4) { drag.moved = true; drag.el.classList.add("dragging"); }
  if (!drag.moved) return;
  const n = Math.round(dx / S.dayW); drag.n = n;
  if (drag.resize) drag.el.style.width = Math.max(20, drag.w0 + n * S.dayW) + "px"; else drag.el.style.left = (drag.left0 + n * S.dayW) + "px";
});
document.addEventListener("pointerup", () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) { if (S.linkFrom) finishLink(S.linkFrom, d.id); else openTask(d.id); return; }
  S.dragMoved = true; setTimeout(() => { S.dragMoved = false; }, 50);
  const n = d.n || 0; if (!n) { render(); return; }
  const t = task(d.id);
  if (d.resize) {
    let ne = addWork(t.end, n); if (ne < t.start) ne = t.start;
    const patch = { end: ne }; const ch = [changeTask(t.id, patch)].concat(n > 0 ? chainChanges(t.id, Object.assign({}, t, patch)) : []);
    commit(ch, "Changed due date of " + t.item + " to " + fmt(ne, true), { details: ch.length > 1 ? "pushed " + (ch.length - 1) + " that wait on it" : "" });
  } else shiftTask(t.id, n, "Moved " + t.item + " to " + fmt(addWork(t.start, n), true));
});
document.addEventListener("pointercancel", () => { if (drag) { drag = null; render(); } });

/* board drag between columns */
document.addEventListener("dragstart", e => { const c = e.target.closest && e.target.closest("[data-card]"); if (!c) return; e.dataTransfer.setData("text/plain", c.dataset.card); e.dataTransfer.effectAllowed = "move"; c.classList.add("drag"); });
document.addEventListener("dragend", e => { const c = e.target.closest && e.target.closest("[data-card]"); if (c) c.classList.remove("drag"); document.querySelectorAll(".col.over").forEach(x => x.classList.remove("over")); });
document.addEventListener("dragover", e => { const col = e.target.closest && e.target.closest("[data-drop]"); if (!col) return; e.preventDefault(); document.querySelectorAll(".col.over").forEach(x => x !== col && x.classList.remove("over")); col.classList.add("over"); });
document.addEventListener("drop", e => {
  const col = e.target.closest && e.target.closest("[data-drop]"); if (!col) return; e.preventDefault();
  const id = e.dataTransfer.getData("text/plain"), t = task(id), s = col.dataset.drop;
  if (!t || t.status === s) return;
  if (s === "Done") closeTask(id); else saveTask(id, { status: s }, t.item + " → " + s);
});

/* ===================== boot ===================== */
const meSel = document.getElementById("meSel");
meSel.value = S.me;
function fromHash() { const h = (location.hash || "").slice(1); S.view = VIEWS.some(v => v.id === h) ? h : "today"; }
window.addEventListener("hashchange", () => { fromHash(); render(); updatePresence(); });
fromHash(); renderTabs();

(async () => {
  const slow = setTimeout(() => { S.slow = true; setSync("warn", "Slow connection"); render(); }, 10000);
  const user = await useCap("user");
  S.user = user;
  if (user) {
    try {
      S.isOwner = await user.isOwner(); S.canAdmin = await user.canEdit(); S.uid = await user.id();
      const w = await user.can("data.write"); if (w === false) S.readOnly = true;
      S.me = S.uid; meSel.value = S.me; local.me = S.me; saveLocal(); document.getElementById("meName").textContent = (S.me === "Florencia" ? "Flor" : S.me); render(); updatePresence();
    } catch (e) {}
  }
  const db = await useCap("db");
  if (!db) { clearTimeout(slow); S.dbMissing = true; setSync("bad", "Offline copy"); render(); return; }
  S.db = db;
  const onErr = e => { setSync("bad", e && e.code === "revoked" ? "Access changed" : "Disconnected"); };
  const reRender = () => { if (!drag) render(); };
  const sub = (col, key, first) => db.collection(col).onSnapshot(snap => {
    const next = {}; snap.docs.forEach(d => { next[d.id] = Object.assign({ id: d.id }, d.data()); });
    S[key] = next;
    if (first) { S.loaded.tasks = true; if (!snap.metadata.fromCache) { clearTimeout(slow); S.slow = false; setSync(S.readOnly ? "warn" : "live", S.readOnly ? "View only" : "Live"); } }
    reRender();
    if (key === "tasks" && S.drawer && S.drawer !== "new" && !(document.activeElement && document.activeElement.closest && document.activeElement.closest(".drawer"))) openTask(S.drawer);
  }, e => { clearTimeout(slow); S.loaded.tasks = true; onErr(e); render(); });
  sub("tasks", "tasks", true); sub("requests", "requests"); sub("milestones", "milestones"); sub("colors", "colors"); sub("ideas", "ideas"); sub("flags", "flags"); sub("people", "people"); sub("dates", "dates"); sub("meta", "meta"); sub("feedback", "feedback");
  db.collection("comments").orderBy("at", "desc").limit(600).onSnapshot(snap => {
    const next = {}; snap.docs.forEach(d => { next[d.id] = Object.assign({ id: d.id }, d.data()); }); S.comments = next; reRender();
    if (S.drawer && S.drawer !== "new" && !(document.activeElement && document.activeElement.closest && document.activeElement.closest(".drawer"))) openTask(S.drawer);
  }, onErr);
  db.collection("notify").orderBy("at", "desc").limit(400).onSnapshot(snap => { const next = {}; snap.docs.forEach(d => { next[d.id] = Object.assign({ id: d.id }, d.data()); }); S.notify = next; reRender(); }, onErr);
  let logReady = false;
  db.collection("log").orderBy("at", "desc").limit(300).onSnapshot(snap => {
    S.log = snap.docs.map(d => d.data());
    if (logReady && !snap.metadata.hasPendingWrites) { const fresh = snap.docChanges().filter(c => c.type === "added").map(c => c.doc.data()).filter(l => l.by && l.by !== S.me && !String(l.by).startsWith(S.me + " ")); if (fresh.length) toast(fresh.length === 1 ? fresh[0].by + ": " + fresh[0].action : fresh.length + " updates from " + [...new Set(fresh.map(l => l.by))].join(", ")); }
    if (!snap.metadata.fromCache) logReady = true;
    if (S.view === "backup") render();
  }, onErr);
  /* live presence: who else has the hub open and where */
  const room = await useCap("room");
  if (room) { S.room = room; room.onPeers(ch => { S.peers = ch.peers; renderPresence(); }, () => { S.peers = []; renderPresence(); }); updatePresence(); setInterval(renderPresence, 60000); }
  db.doc("meta/backup").onSnapshot(d => { S.backup = d.exists ? d.data() : null; if (S.view === "backup") render(); }, () => {});
  /* hours: each person reads their own; the owner reads everyone's */
  const timeSubs = {};
  const subTime = key => { if (timeSubs[key]) return; timeSubs[key] = db.collection("time/" + key + "/entries").onSnapshot(snap => {
    Object.keys(S.time).forEach(id => { if (S.time[id]._path && S.time[id]._path.startsWith("time/" + key + "/")) delete S.time[id]; });
    snap.docs.forEach(d => { S.time[d.id] = Object.assign({ id: d.id, _path: "time/" + key + "/entries/" + d.id }, d.data()); });
    if (S.view === "hours") render();
  }, () => {}); };
  if (S.uid) subTime(S.uid);
  if (S.isOwner) db.collection("time").onSnapshot(snap => { snap.docs.forEach(d => subTime(d.id)); }, () => {});
})();
</script>
